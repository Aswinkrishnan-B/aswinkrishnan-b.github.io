<!DOCTYPE html>
<html lang="ml">

<head>

    <meta charset="UTF-8">

    <!-- Important for YouTube embedded-player requests -->
    <meta
        name="referrer"
        content="strict-origin-when-cross-origin"
    >

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>പ്രൈവറ്റ് ബസ് പാട്ട് പെട്ടി</title>

    <link rel="stylesheet" href="./style.css">

</head>


<body>

    <main id="app">

        <!-- =================================================
             BACKGROUND
        ================================================== -->

        <div id="background"></div>

        <div id="dark-overlay"></div>


        <!-- =================================================
             TOP LEFT CLOCK
        ================================================== -->

        <div id="clock">
            3:42 pm
        </div>


        <!-- =================================================
             TOP RIGHT ONLINE COUNTER
        ================================================== -->

        <div id="online">

            <span class="online-dot"></span>

            <span id="online-number">
                128
            </span>

            <span class="online-text">
                online
            </span>

        </div>


        <!-- =================================================
             TITLE
        ================================================== -->

        <img
            id="title-image"
            src="./title.png"
            alt="പ്രൈവറ്റ് ബസ് പാട്ട് പെട്ടി"
        >


        <!-- =================================================
             START SCREEN
        ================================================== -->

        <div id="start-screen">

            <button
                id="start-button"
                type="button"
            >

                <span class="start-play">
                    ▶
                </span>

                <span>
                    തുടങ്ങൂ
                </span>

            </button>


            <div class="start-subtitle">
                സ്വകാര്യ ബസ് യാത്രയ്ക്കുള്ള പാട്ടുപെട്ടി
            </div>

        </div>


        <!-- =================================================
             YOUTUBE PLAYER
             
             This is deliberately a real iframe.
             It is kept almost completely invisible.
        ================================================== -->

        <iframe
            id="youtube-player"
            src="https://www.youtube.com/embed/videoseries?list=PLkX31-lqoSPdV5dI4SQPTYxxlwRiSOLzD&enablejsapi=1&origin=https%3A%2F%2Faswinkrishnan-b.github.io"
            title="പ്രൈവറ്റ് ബസ് പാട്ട് പെട്ടി"
            frameborder="0"
            allow="autoplay; encrypted-media"
            referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>


        <!-- =================================================
             GLASS MUSIC PLAYER
        ================================================== -->

        <div id="music-player">


            <!-- Album / video thumbnail -->

            <div id="album-art-container">

                <img
                    id="album-art"
                    src=""
                    alt=""
                >

                <div id="album-placeholder">
                    ♪
                </div>

            </div>


            <!-- Song information -->

            <div id="track-information">

                <div id="now-playing">
                    ഇപ്പോൾ കേൾക്കുന്നത്
                </div>

                <div id="track-title">
                    പ്രൈവറ്റ് ബസ് പാട്ട് പെട്ടി
                </div>

            </div>


            <!-- Controls -->

            <div id="controls">

                <button
                    id="play-pause"
                    type="button"
                    aria-label="Play"
                >
                    ▶
                </button>


                <button
                    id="next"
                    type="button"
                    aria-label="Next song"
                >
                    <span>▶</span><span>▶</span>
                </button>

            </div>

        </div>

    </main>


    <!-- =====================================================
         OUR JAVASCRIPT
         
         Must load BEFORE the YouTube API so that
         onYouTubeIframeAPIReady already exists.
    ====================================================== -->

    <script src="./app.js"></script>


    <!-- =====================================================
         YOUTUBE IFRAME API
    ====================================================== -->

    <script src="https://www.youtube.com/iframe_api"></script>

</body>

</html>
