<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>പ്രൈവറ്റ് ബസ് പാട്ട് പെട്ടി</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Chettan+2:wght@500;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-layer"></div>
  <div class="bg-vignette"></div>

  <main class="stage">

    <header class="title-wrap">
      <img class="title-img" src="title.png" alt="പ്രൈവറ്റ് ബസ് പാട്ട് പെട്ടി">
      <p class="subtitle">നാടൻ ബസ് യാത്രയുടെ പാട്ടുപെട്ടി</p>
    </header>

    <section id="loginScreen" class="login-card glass">
      <p class="login-copy">തുടങ്ങാൻ Spotify-ലേക്ക് ലോഗിൻ ചെയ്യുക (Premium വേണം)</p>
      <button id="loginBtn" class="btn primary">Spotify ലോഗിൻ</button>
    </section>

    <section id="player" class="player-card glass hidden">
      <div class="art-frame">
        <img id="albumArt" src="" alt="" class="album-art">
      </div>

      <div class="track-meta">
        <p id="trackName" class="track-name">—</p>
        <p id="trackArtist" class="track-artist">—</p>
      </div>

      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>

      <div class="controls">
        <button id="playPauseBtn" class="btn control" aria-label="Play or pause">
          <svg id="iconPlay" viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
          <svg id="iconPause" viewBox="0 0 24 24" width="26" height="26" class="hidden"><path fill="currentColor" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button id="skipBtn" class="btn control" aria-label="Next song">
          <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>

      <p id="statusLine" class="status-line"></p>
    </section>

  </main>

  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script src="app.js"></script>
</body>
</html>
