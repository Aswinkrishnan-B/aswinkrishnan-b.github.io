<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#17120f">
    <title>പ്രൈവറ്റ് ബസ് പാട്ട് പെട്ടി</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./style.css">
</head>

<body>
<div id="app">

    <div id="background"></div>
    <div id="dark-overlay"></div>

    <div id="clock">--:-- pm</div>

    <div id="online">
        <span class="online-dot"></span>
        <span id="online-count">128</span>
        <span class="online-text">online</span>
    </div>

    <div id="site-title">
        <span>പ്രൈവറ്റ് ബസ്</span>
        <span>പാട്ട് പെട്ടി</span>
    </div>

    <!-- Current song information -->
    <div id="song-card" aria-live="polite">
        <div class="song-art-wrap">
            <img id="song-art" src="" alt="Album artwork">
        </div>

        <div class="song-info">
            <div class="song-label">NOW PLAYING</div>
            <div id="song-title">Loading...</div>
            <div id="song-artist">...</div>
        </div>
    </div>

    <!-- Hidden YouTube player -->
    <div id="youtube-player"></div>

    <!-- Start overlay -->
    <div id="start-screen">
        <button id="start-button" type="button">
            <span class="start-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10-6.8c.6-.4.6-1.3 0-1.7l-10-6.8C8.9 4 8 4.4 8 5.2z"/>
                </svg>
            </span>
            <span>തുടങ്ങൂ</span>
        </button>

        <div class="start-subtitle">
            Tap to start the music
        </div>
    </div>

    <!-- Bottom player -->
    <div id="music-player">

        <div id="vinyl-container">
            <div id="vinyl">
                <div class="vinyl-label"></div>
                <div class="vinyl-hole"></div>
            </div>
        </div>

        <div id="player-status">
            <div id="now-playing">LIVE NOW</div>

            <div id="playing-indicator" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <div id="controls">
            <button id="play-pause" type="button" aria-label="Play or pause">
                <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10-6.8c.6-.4.6-1.3 0-1.7l-10-6.8C8.9 4 8 4.4 8 5.2z"/>
                </svg>

                <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M7 5h3v14H7zM14 5h3v14h-3z"/>
                </svg>
            </button>

            <button id="next" type="button" aria-label="Next song">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5.8 5.2v13.6c0 .8.9 1.3 1.6.9l8.1-5.5v4.6c0 .8.9 1.3 1.6.9l2.4-1.6c.3-.2.5-.5.5-.9V6.8c0-.4-.2-.7-.5-.9l-2.4-1.6c-.7-.4-1.6.1-1.6.9v4.6L7.4 4.3c-.7-.4-1.6.1-1.6.9z"/>
                </svg>
            </button>
        </div>
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="./app.js"></script>
</body>
</html>
