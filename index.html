<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>പ്രൈവറ്റ് ബസ് പാട്ട് പെട്ടി</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Full-screen background -->
    <main class="scene">

        <div class="background"></div>
        <div class="vignette"></div>

        <!-- Top-left clock -->
        <div class="clock" id="clock">
            3:38 pm
        </div>

        <!-- Top-right online indicator -->
        <div class="online">
            <span class="online-dot"></span>
            <span id="listenerCount">127</span>
            <span class="online-label">online</span>
        </div>

        <!-- Title -->
        <img
            src="title.png"
            class="site-title"
            alt="പ്രൈവറ്റ് ബസ് പാട്ട് പെട്ടി"
        >

        <!-- Initial interaction screen -->
        <div class="start-screen" id="startScreen">

            <button class="start-button" id="startButton">
                <span class="start-icon">▶</span>
                <span>തുടങ്ങൂ</span>
            </button>

            <div class="start-hint">
                സ്വകാര്യ ബസ് യാത്രയ്ക്കുള്ള പാട്ടുപെട്ടി
            </div>

        </div>

        <!-- Hidden YouTube player -->
        <div id="youtube-player"></div>

        <!-- Bottom glass player -->
        <div class="player-container" id="playerContainer">

            <div class="player-bar">

                <!-- Current song thumbnail -->
                <div class="thumbnail-wrapper">
                    <img
                        id="songThumbnail"
                        class="song-thumbnail"
                        src=""
                        alt=""
                    >

                    <div class="thumbnail-placeholder" id="thumbnailPlaceholder">
                        ♪
                    </div>
                </div>

                <!-- Song information -->
                <div class="song-info">

                    <div class="song-label">
                        ഇപ്പോൾ കേൾക്കുന്നത്
                    </div>

                    <div
                        class="song-title"
                        id="songTitle"
                    >
                        പ്രൈവറ്റ് ബസ് പാട്ട് പെട്ടി
                    </div>

                </div>

                <!-- Controls -->
                <div class="controls">

                    <button
                        class="control-button play-button"
                        id="playButton"
                        aria-label="Play"
                    >
                        ▶
                    </button>

                    <button
                        class="control-button next-button"
                        id="nextButton"
                        aria-label="Next song"
                    >
                        <span>▶</span><span>▶</span>
                    </button>

                </div>

            </div>

        </div>

    </main>

    <script src="app.js"></script>

</body>
</html>
