<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>പ്രൈവറ്റ് ബസ് പാട്ട് പെട്ടി</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div id="app">

        <!-- BACKGROUND -->
        <div id="background"></div>
        <div id="dark-overlay"></div>

        <!-- TOP INFORMATION -->

        <div id="clock">3:42 pm</div>

        <div id="online">
            <span class="online-dot"></span>
            <span id="online-number">128</span>
            <span class="online-text">online</span>
        </div>


        <!-- TITLE -->

        <img
            id="title-image"
            src="./title.png"
            alt="പ്രൈവറ്റ് ബസ് പാട്ട് പെട്ടി"
        >


        <!-- START SCREEN -->

        <div id="start-screen">

            <button id="start-button">
                <span class="start-play">▶</span>
                <span>തുടങ്ങൂ</span>
            </button>

            <div class="start-subtitle">
                സ്വകാര്യ ബസ് യാത്രയ്ക്കുള്ള പാട്ടുപെട്ടി
            </div>

        </div>


        <!-- YOUTUBE PLAYER -->

        <div id="youtube-player"></div>


        <!-- MUSIC PLAYER -->

        <div id="music-player">

            <div id="album-art-container">

                <img
                    id="album-art"
                    src=""
                    alt=""
                >

                <div id="album-placeholder">
                    ♪
                </div>

            </div>


            <div id="track-information">

                <div id="now-playing">
                    ഇപ്പോൾ കേൾക്കുന്നത്
                </div>

                <div id="track-title">
                    പ്രൈവറ്റ് ബസ് പാട്ട് പെട്ടി
                </div>

            </div>


            <div id="controls">

                <button
                    id="play-pause"
                    aria-label="Play"
                >
                    ▶
                </button>

                <button
                    id="next"
                    aria-label="Next"
                >
                    <span>▶</span><span>▶</span>
                </button>

            </div>

        </div>

    </div>


    <!-- YOUTUBE API -->

    <script src="https://www.youtube.com/iframe_api"></script>

    <!-- OUR CODE -->

    <script src="./app.js"></script>

</body>
</html>
