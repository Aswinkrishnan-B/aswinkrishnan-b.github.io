<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>പ്രൈവറ്റ് ബസ് പാട്ട് പെട്ടി</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-layer"></div>
  <div class="bg-vignette"></div>

  <div class="top-bar">
    <div id="clock" class="clock">--:--</div>
    <div class="online-badge">
      <span class="dot"></span>
      <span id="onlineCount">--</span>&nbsp;online
    </div>
  </div>

  <header class="title-wrap">
    <img class="title-img" src="title.png" alt="പ്രൈവറ്റ് ബസ് പാട്ട് പെട്ടി">
  </header>

  <!-- Spotify's public embed: anyone can play, no login required. -->
  <section class="player-bar glass">
    <iframe
      title="പ്രൈവറ്റ് ബസ് പാട്ട് പെട്ടി playlist"
      style="border-radius:16px"
      src="https://open.spotify.com/embed/playlist/21iS4SeHFzpuWCAGIh8PFH?utm_source=generator&theme=0"
      width="100%"
      height="152"
      frameborder="0"
      allowfullscreen=""
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
    </iframe>
  </section>

  <script src="app.js"></script>
</body>
</html>
