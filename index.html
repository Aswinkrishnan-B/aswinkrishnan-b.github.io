<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>പ്രൈവറ്റ് ബസ് പാട്ട് പെട്ടി</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-layer"></div>
  <div class="bg-vignette"></div>

  <div class="top-bar">
    <div id="clock" class="clock">--:--</div>
    <div class="online-badge">
      <span class="dot"></span>
      <span id="onlineCount">--</span>&nbsp;online
    </div>
  </div>

  <header class="title-wrap">
    <img class="title-img" src="title.png" alt="പ്രൈവറ്റ് ബസ് പാട്ട് പെട്ടി">
  </header>

  <main class="stage">

    <section id="loginScreen" class="login-card glass">
      <p class="login-copy">തുടങ്ങാൻ Spotify-ലേക്ക് ലോഗിൻ ചെയ്യുക (Premium വേണം)</p>
      <button id="loginBtn" class="btn primary">Spotify ലോഗിൻ</button>
    </section>

  </main>

  <section id="player" class="player-bar glass hidden">
    <div class="art-frame">
      <img id="albumArt" src="" alt="" class="album-art">
    </div>

    <div class="track-meta">
      <p id="trackName" class="track-name">—</p>
      <p id="trackArtist" class="track-artist">—</p>
      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </div>

    <div class="controls">
      <button id="playPauseBtn" class="btn control control-main" aria-label="Play or pause">
        <svg id="iconPlay" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        <svg id="iconPause" viewBox="0 0 24 24" width="22" height="22" class="hidden"><path fill="currentColor" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <button id="skipBtn" class="btn control" aria-label="Next song">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
  </section>

  <p id="statusLine" class="status-line"></p>

  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script src="app.js"></script>
</body>
</html>
